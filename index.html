<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sunday Drive</title>
    <meta name="description" content="A quiet weekend car. Miles while you are away." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C45C2A'/%3E%3Cpath fill='%23F7E7C7' d='M6 20h20l-2-6H8z'/%3E%3Ccircle cx='10' cy='22' r='2.2' fill='%232A2118'/%3E%3Ccircle cx='22' cy='22' r='2.2' fill='%232A2118'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div id="hud">
      <header class="topbar">
        <div class="brand">
          <h1>Sunday Drive</h1>
          <p id="destination">The county line</p>
        </div>
        <div class="top-actions">
          <div class="whispers">
            <p id="company" class="company" hidden></p>
            <p id="souvenir" class="souvenir">No souvenirs yet</p>
          </div>
          <div class="menu-wrap">
            <button
              type="button"
              id="menu"
              class="ghost menu-btn"
              aria-expanded="false"
              aria-controls="menu-panel"
              aria-haspopup="true"
            >
              <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
              Menu
            </button>
            <div id="menu-panel" class="menu-panel" hidden role="group" aria-label="Menu">
              <button
                type="button"
                id="mute"
                class="menu-item"
                aria-pressed="false"
                title="Mute music and the car"
                aria-label="Sound on. Mutes the music and the car."
              >
                Sound on
              </button>
              <button type="button" id="save-file" class="menu-item">Save file</button>
              <button type="button" id="postcards" class="menu-item">Postcards</button>
              <button type="button" id="large-type" class="menu-item" aria-pressed="false">
                Larger type
              </button>
              <button type="button" id="reduce-motion" class="menu-item" aria-pressed="false">
                Less motion
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="stage">
        <section class="odometer" aria-live="polite">
          <p id="miles" class="miles">0</p>
          <p class="unit">miles</p>
          <p id="rate" class="rate">0.02 mi/s · tap for more</p>
          <p id="trip" class="trip">This trip · 0 / 8,000 to the next town</p>
        </section>

        <div class="drive-wrap">
          <button type="button" id="drive" class="drive">Drive</button>
          <p class="hint" id="drive-hint">Click or press Space</p>
        </div>

        <button
          type="button"
          id="panel-toggle"
          class="panel-toggle"
          aria-expanded="false"
          aria-controls="car-panel"
        >
          The car
        </button>
      </main>

      <aside class="panel" id="car-panel" aria-label="Upgrades">
        <h2>The car</h2>
        <p class="panel-lead">Spend miles. The road gets easier.</p>
        <div id="upgrades" class="upgrades"></div>
        <div class="prestige-box">
          <button type="button" id="prestige" class="prestige" disabled>
            New destination
          </button>
          <p id="prestige-hint" class="prestige-hint">
            Arrive with enough miles. Keep a souvenir. Start the next road.
          </p>
        </div>
      </aside>
    </div>

    <input id="save-input" type="file" accept="application/json,.json,text/plain" hidden />

    <div id="toast" class="toast" hidden role="status"></div>

    <div id="modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
